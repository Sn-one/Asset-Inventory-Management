{% macro field(label, name, value='', type='text', placeholder='', required=false) %}
<div>
  <label class="block text-sm font-medium text-gray-700 mb-1">
    {{ label }}{% if required %}<span class="text-red-500 ml-0.5">*</span>{% endif %}
  </label>
  <input type="{{ type }}" name="{{ name }}" value="{{ value or '' }}"
         {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
         {% if required %}required{% endif %}
         class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 transition" />
</div>
{% endmacro %}

{% macro textarea_field(label, name, value='', placeholder='') %}
<div>
  <label class="block text-sm font-medium text-gray-700 mb-1">{{ label }}</label>
  <textarea name="{{ name }}" rows="3" placeholder="{{ placeholder }}"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 transition resize-none">{{ value or '' }}</textarea>
</div>
{% endmacro %}

{% macro select_field(label, name, options, selected='', placeholder='Select…') %}
<div>
  <label class="block text-sm font-medium text-gray-700 mb-1">{{ label }}</label>
  <select name="{{ name }}"
          class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white transition">
    <option value="">{{ placeholder }}</option>
    {% for opt in options %}
    <option value="{{ opt }}" {{ 'selected' if opt == selected }}>{{ opt }}</option>
    {% endfor %}
  </select>
</div>
{% endmacro %}
